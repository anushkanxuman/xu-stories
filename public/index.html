<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Xu's Stories</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Xu's Stories</h1>
    <p>Scroll or swipe up and down inside the phone. ↑ ↓ keys work too.</p>
  </header>

  <main class="stage">
    <div class="phone" id="phone">
      <div class="notch"></div>
      <div class="head"><span>Drop</span></div>
      <div class="feed" id="feed" tabindex="0" aria-label="Video feed"></div>
      <button class="mute" id="mute" aria-label="Mute" title="Sound on / off">🔊</button>
      <p class="empty" id="empty" hidden>No videos yet. Add .mp4 files to <code>public/videos</code> and run <code>node build.js</code>.</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
