<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xu's Stories</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Xu's Stories</h1>
    <p>Click a video to play it right there. Drag, scroll or use ← → to spin the circle.</p>
  </header>

  <main>
    <section class="carousel" id="carousel" aria-label="Video carousel">
      <div class="ring" id="ring"></div>
      <p class="empty" id="empty" hidden>No videos yet. Drop .mp4 / .webm files into the <code>videos</code> folder and refresh.</p>
    </section>


    <section class="reviews" id="reviews" hidden>
      <div class="reviews-head">
        <h2>Reviews <span id="reviews-for"></span></h2>
        <div class="avg" id="avg"></div>
      </div>

      <form id="review-form" autocomplete="off">
        <input id="r-name" name="name" maxlength="40" placeholder="Your name" aria-label="Your name">
        <div class="stars" id="r-stars" role="radiogroup" aria-label="Rating"></div>
        <textarea id="r-text" name="text" maxlength="1000" rows="3" placeholder="Write your review…" required aria-label="Your review"></textarea>
        <div class="form-row">
          <span class="form-msg" id="form-msg" role="status"></span>
          <button type="submit">Post review</button>
        </div>
      </form>

      <ul class="review-list" id="review-list"></ul>
    </section>
  </main>

  <footer class="player" id="player" hidden>
    <div class="now">
      <div class="now-title" id="now-title">—</div>
      <div class="now-sub" id="now-sub"></div>
    </div>
    <div class="controls">
      <div class="buttons">
        <button id="prev" aria-label="Previous video" title="Previous">⏮</button>
        <button id="play" class="play" aria-label="Play" title="Play / pause">▶</button>
        <button id="next" aria-label="Next video" title="Next">⏭</button>
      </div>
      <div class="seek">
        <span id="cur">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
        <span id="dur">0:00</span>
      </div>
    </div>
    <div class="vol">
      <button id="mute" aria-label="Mute" title="Mute">🔊</button>
      <input id="volume" type="range" min="0" max="100" value="80" aria-label="Volume">
    </div>
  </footer>

  <div hidden><video id="video" playsinline preload="metadata"></video></div>

  <script src="app.js"></script>
</body>
</html>
